[project]
name = "ml"
version = "0.1.0"
description = ""
authors = [
    {name = "KookaS", email = "olivier.charrez@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "jax[cpu]>=0.4.35",
    "matplotlib>=3.10.8",
    "tensorboard>=2.20.0",
    "torch>=2.9.1",
    "transformers>=5.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "loss", "model"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "ruff>=0.15.17",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Enable standard rules (E/W), Flake8 bugbear (B), Pyupgrade (UP), and Isort (I)
select = ["E", "W", "F", "B", "UP", "I"]
# Tell Ruff's linter to ignore line lengths (E501) since Black completely owns the layout engine
ignore = ["E501"]

[tool.ruff.format]
# Ensures the formatter aggressively wraps code blocks, arguments, and lists where possible
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_calls = false  # Stops complaining when you call untyped NormRms/Mlp
disallow_untyped_defs = false   # Stops complaining if a function misses annotations
